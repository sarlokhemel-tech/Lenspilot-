name: Browser Agent v2 tests

# সার্ভার (mock LLM) + lp_observe.js/lp_act.js (আসল Chromium) — APK build-এর থেকে আলাদা, তাই build ভাঙে না।
on:
  workflow_dispatch: {}
  push:
    paths:
      - "app.py"
      - "app/src/main/assets/lp_*.js"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install flask requests numpy matplotlib pillow firebase-admin playwright
          python -m playwright install --with-deps chromium
      - name: Server tests (mock LLM)
        if: hashFiles('tests/browser_v2_server_test.py') != ''
        run: python tests/browser_v2_server_test.py
      - name: Discussion screen-guide tests
        if: hashFiles('tests/discussion_guide_test.py') != ''
        run: PYTHONPATH=. python tests/discussion_guide_test.py
      - name: Multi-agent Agent A tests
        if: hashFiles('tests/multi_agent_agent_a_test.py') != ''
        run: python tests/multi_agent_agent_a_test.py
      - name: Scenario runner (§9)
        if: hashFiles('tests/browser_scenario_runner.py') != ''
        run: python tests/browser_scenario_runner.py
      - name: JS tests (real Chromium)
        if: hashFiles('tests/lp_js_chromium_test.py') != ''
        run: python tests/lp_js_chromium_test.py
      - name: v112 guards + hard-task simulation
        run: |
          python tests/test_v112_guards.py
          python tests/sim_v112_hard.py --seeds=40
      - name: v130 research (Groq 120B search) + prompt compaction
        run: python tests/test_v130_research.py

      - name: v132 scroll / under-overlay / page-cycle
        run: python tests/test_v132_scroll_overlay.py

      - name: v133 dead-end memory
        run: python tests/test_v133_deadends.py
